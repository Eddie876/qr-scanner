name: Build iOS IPA

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "**/*.swift"
      - "Info.plist"
      - "project.yml"
      - ".github/workflows/build-ios.yml"
      - "Assets.xcassets/**"

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show project configuration
        run: |
          xcodebuild \
            -project QRScanner.xcodeproj \
            -scheme QRScanner \
            -list

      - name: Build iOS app
        run: |
          xcodebuild \
            -project QRScanner.xcodeproj \
            -scheme QRScanner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Validate app and read version
        run: |
          APP_PATH="$PWD/build/Build/Products/Release-iphoneos/QRScanner.app"
          PLIST="$APP_PATH/Info.plist"

          if [ ! -d "$APP_PATH" ]; then
            echo "QRScanner.app not found at:"
            echo "$APP_PATH"
            exit 1
          fi

          echo "Built Info.plist:"
          plutil -p "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Print :NSCameraUsageDescription" \
            "$PLIST"

          VERSION=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$PLIST")

          BUILD=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$PLIST")

          echo "App version: $VERSION"
          echo "Build number: $BUILD"

          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD=$BUILD" >> "$GITHUB_ENV"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          EXPECTED_TAG="v${APP_VERSION}"

          echo "Tag:      $GITHUB_REF_NAME"
          echo "Expected: $EXPECTED_TAG"

          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Release tag does not match app version."
            echo "project.yml version: ${APP_VERSION}"
            echo "Git tag: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Package unsigned IPA
        run: |
          APP_PATH="$PWD/build/Build/Products/Release-iphoneos/QRScanner.app"
          IPA_FILE="QRScanner-v${APP_VERSION}-unsigned.ipa"

          rm -rf Payload
          mkdir Payload

          cp -R "$APP_PATH" Payload/QRScanner.app

          zip -qry "$IPA_FILE" Payload

          echo "Generated:"
          ls -lh "$IPA_FILE"

          echo "IPA_FILE=$IPA_FILE" >> "$GITHUB_ENV"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: QRScanner-v${{ env.APP_VERSION }}-unsigned
          path: ${{ env.IPA_FILE }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$IPA_FILE" \
            --title "QR Scanner $GITHUB_REF_NAME" \
            --generate-notes