name: QRScanner

options:
  bundleIdPrefix: com.eddie876
  deploymentTarget:
    iOS: "17.0"

targets:
  QRScanner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: QRScannerApp.swift
      - path: ContentView.swift
      - path: Camera
      - path: Assets.xcassets

    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "QR Scanner"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCameraUsageDescription: "QR Scanner needs camera access to scan QR codes."

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eddie876.qrscanner
        PRODUCT_NAME: QRScanner
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

    scheme:
      gatherCoverageData: false